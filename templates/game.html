<!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Turing Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .container {
            width: 90%;
            max-width: 800px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
            flex-shrink: 0;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .header .subtitle {
            font-size: 14px;
            opacity: 0.9;
        }
        
        #loginScreen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            overflow-y: auto;
        }
        
        #loginScreen input, #loginScreen select {
            width: 100%;
            max-width: 300px;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            text-align: center;
            background: white;
        }
        
        #loginScreen input:focus, #loginScreen select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        #loginScreen button {
            width: 100%;
            max-width: 300px;
            padding: 15px;
            margin-top: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        #loginScreen button:hover {
            transform: translateY(-2px);
        }
        
        #gameScreen {
            display: none;
            flex: 1;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }
        
        .info-bar {
            background: #f5f5f5;
            padding: 15px 20px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        
        .info-bar .player-name {
            font-weight: bold;
            color: #667eea;
        }
        
        .info-bar .role-badge {
            background: #ff6b6b;
            color: white;
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }
        
        #phaseIndicator {
            background: #fff9e6;
            padding: 10px 20px;
            text-align: center;
            font-weight: 600;
            color: #856404;
            border-bottom: 2px solid #ffc107;
            flex-shrink: 0;
        }
        
        #rulesBox {
            background: #fffbe7;
            border-left: 5px solid #ffc107;
            padding: 15px 20px;
            margin: 0;
            font-size: 14px;
            color: #6c5b00;
            white-space: pre-wrap;
            line-height: 1.6;
            display: none;
            flex-shrink: 0;
            max-height: 150px;
            overflow-y: auto;
        }
        
        #messagesContainer {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 120px;
            background: #fafafa;
            min-height: 0;
        }
        
        .message {
            margin-bottom: 15px;
            padding: 12px 15px;
            border-radius: 10px;
            max-width: 85%;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.manager {
            background: #fff3cd;
            border-left: 5px solid #ffc107;
            border-radius: 12px;
            margin-left: 0;
            margin-right: auto;
            font-weight: 500;
            color: #856404;
            box-shadow: 0 2px 4px rgba(255, 193, 7, 0.2);
            direction: ltr;
            text-align: left;
            unicode-bidi: plaintext;
        }
        
        .message.manager::before {
            content: "🛠️ Game Manager: ";
            font-weight: bold;
            display: block;
            margin-bottom: 4px;
            font-size: 13px;
            direction: ltr;
            unicode-bidi: plaintext;
        }
        
        .message.chat {
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            color: #333;
            border-left: 3px solid #667eea;
            direction: ltr;
            text-align: left;
            unicode-bidi: plaintext;
        }
        
        #votePanel {
            display: none;
            background: linear-gradient(180deg, #ffe2e2 0%, #ffd6d6 100%);
            border-top: 3px solid #dc3545;
            padding: 25px 20px;
            padding-left: 30px;
            padding-right: 30px;
            text-align: center;
            box-shadow: 0 -2px 6px rgba(0,0,0,0.08);
            animation: slideUp 0.25s ease-out;
            position: sticky;
            bottom: 0;
            z-index: 9999;
            flex-shrink: 0;
        }
        
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to   { transform: translateY(0); opacity: 1; }
        }
        
        #votePanel h3 {
            margin-bottom: 20px;
            font-size: 20px;
            color: #b10000;
            font-weight: 700;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #votePanel h3::before {
            content: "⚠️";
            font-size: 22px;
            margin-right: 8px;
        }
        
        #voteButtons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        
        .vote-button {
            padding: 14px 26px;
            font-size: 16px;
            border-radius: 25px;
            border: 2px solid #dc3545;
            background: white;
            color: #dc3545;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.25s ease;
            min-width: 120px;
        }
        
        .vote-button:hover {
            background: #dc3545;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(220,53,69,0.4);
        }
        
        .vote-button.disabled {
            opacity: 0.5;
            pointer-events: none;
        }
        
        #inputArea {
            padding: 15px 20px;
            background: white;
            border-top: 2px solid #e0e0e0;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-shrink: 0;
        }
        
        #inputArea input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 14px;
        }
        
        #inputArea input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        #inputArea input:disabled {
            background: #f5f5f5;
            cursor: not-allowed;
        }
        
        #inputArea button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            white-space: nowrap;
            transition: all 0.2s;
        }
        
        #inputArea button:hover:not(:disabled) {
            background: #5568d3;
            transform: translateY(-1px);
        }
        
        #inputArea button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        #inputArea.hidden {
            display: none !important;
        }
        
        .error {
            color: #dc3545;
            text-align: center;
            margin: 10px 0;
        }
        
        /* Survey Modal Styles */
        #surveyModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 10000;
            align-items: center;
            justify-content: center;
        }
        
        #surveyModal.show {
            display: flex;
        }
        
        .survey-content {
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            animation: modalSlideIn 0.3s ease-out;
        }
        
        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .survey-content h2 {
            color: #667eea;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .survey-question {
            margin-bottom: 25px;
        }
        
        .survey-question label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
        }
        
        .survey-question select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            background: white;
        }
        
        .survey-question select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .confidence-options {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        
        .confidence-option {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
        }
        
        .confidence-option:hover {
            border-color: #667eea;
            background: #f0f0ff;
        }
        
        .confidence-option.selected {
            border-color: #667eea;
            background: #667eea;
            color: white;
            font-weight: bold;
        }
        
        #surveySubmitBtn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 10px;
        }
        
        #surveySubmitBtn:hover:not(:disabled) {
            transform: translateY(-2px);
        }
        
        #surveySubmitBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .survey-thank-you {
            text-align: center;
            padding: 20px;
        }
        
        .survey-thank-you h3 {
            color: #28a745;
            margin-bottom: 10px;
        }
        
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎭 Social Turing Test</h1>
            <div class="subtitle">Can you identify the AI?</div>
        </div>
        
        <div id="loginScreen">
            <h2 style="margin-bottom: 30px; color: #333;">Join Game</h2>
            <input type="text" id="gameIdInput" placeholder="Game ID (e.g., 0034)" onblur="loadPlayers()" />
            <select id="realNameSelect">
                <option value="">Select your name...</option>
            </select>
            <button onclick="joinGame()">Join Game</button>
            <div id="loginError" class="error"></div>
        </div>
        
        <div id="gameScreen">
            <div class="info-bar">
                <div>
                    <span>Playing as: </span>
                    <span class="player-name" id="playerName"></span>
                </div>
                <div id="roleBadge"></div>
            </div>
            
            <div id="phaseIndicator">⏳ Waiting for players...</div>
            <div id="rulesBox"></div>
            
            <div id="messagesContainer"></div>
            
            <div id="votePanel">
                <h3>Voting Phase - Select who to eliminate</h3>
                <div id="voteButtons"></div>
            </div>
            
            <div id="inputArea">
                <input type="text" id="messageInput" placeholder="Waiting for game to start..." disabled onkeypress="handleKeyPress(event)" />
                <button onclick="sendMessage()" disabled>Send</button>
            </div>
        </div>
    </div>
    
    <!-- Survey Modal -->
    <div id="surveyModal">
        <div class="survey-content">
            <div id="surveyForm">
                <h2>📊 End of Game Survey</h2>
                
                <div class="survey-question">
                    <label for="aiGuess">Who do you think was the AI?</label>
                    <select id="aiGuess">
                        <option value="">Select a player...</option>
                    </select>
                </div>
                
                <div class="survey-question">
                    <label>How confident are you? (1 = Not confident, 5 = Very confident)</label>
                    <div class="confidence-options">
                        <div class="confidence-option" onclick="selectConfidence(1)">1</div>
                        <div class="confidence-option" onclick="selectConfidence(2)">2</div>
                        <div class="confidence-option" onclick="selectConfidence(3)">3</div>
                        <div class="confidence-option" onclick="selectConfidence(4)">4</div>
                        <div class="confidence-option" onclick="selectConfidence(5)">5</div>
                    </div>
                </div>
                
                <button id="surveySubmitBtn" onclick="submitSurvey()">Submit Survey</button>
            </div>
            
            <div id="surveyThankYou" class="survey-thank-you" style="display: none;">
                <h3>✅ Thank You!</h3>
                <p>Your response has been recorded.</p>
            </div>
        </div>
    </div>
    
    <script>
        let sessionId = null;
        let playerName = null;
        let isAI = false;
        let pollInterval = null;
        let messageCount = 0;
        let hasVoted = false;
        let gameOverMessageShown = false;
        let surveyShown = false;
        let selectedConfidence = null;
        
        // Generate consistent color for each player based on their name
        function getPlayerColor(name) {
            let hash = 0;
            for (let i = 0; i < name.length; i++) {
                hash = name.charCodeAt(i) + ((hash << 5) - hash);
            }
            const hue = Math.abs(hash % 360);
            return `hsl(${hue}, 70%, 45%)`; // Saturated, readable colors
        }
        
        // Format chat message with colored player name
        function formatChatMessage(text) {
            // Extract player name from format: "[timestamp] PlayerName: message"
            const match = text.match(/\[.*?\]\s*(.+?):\s*(.+)/);
            if (match) {
                const playerNameInMsg = match[1];
                const message = match[2];
                const color = getPlayerColor(playerNameInMsg);
                return `<span style="color: ${color}; font-weight: bold;">${playerNameInMsg}:</span> ${message}`;
            }
            return text;
        }
        
        function loadPlayers() {
            const gameId = document.getElementById('gameIdInput').value.trim();
            const errorDiv = document.getElementById('loginError');
            const select = document.getElementById('realNameSelect');
            
            if (!gameId) return;
            
            fetch('/get_players', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({game_id: gameId})
            })
            .then(r => r.json())
            .then(data => {
                if (data.error) {
                    errorDiv.textContent = data.error;
                    select.innerHTML = '<option value="">Game not found</option>';
                } else {
                    select.innerHTML = '<option value="">Select your name...</option>';
                    data.players.forEach(name => {
                        const option = document.createElement('option');
                        option.value = name;
                        option.textContent = name;
                        select.appendChild(option);
                    });
                    errorDiv.textContent = '';
                }
            })
            .catch(err => {
                errorDiv.textContent = 'Error loading players';
                console.error(err);
            });
        }
        
        function joinGame() {
            const gameId = document.getElementById('gameIdInput').value.trim();
            const realName = document.getElementById('realNameSelect').value;
            const errorDiv = document.getElementById('loginError');
            
            if (!gameId || !realName) {
                errorDiv.textContent = 'Please select game and name';
                return;
            }
            
            fetch('/join', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({game_id: gameId, real_name: realName})
            })
            .then(r => r.json())
            .then(data => {
                if (data.error) {
                    errorDiv.textContent = data.error;
                } else {
                    sessionId = data.session_id;
                    playerName = data.code_name;
                    isAI = data.is_ai;
                    
                    document.getElementById('loginScreen').style.display = 'none';
                    document.getElementById('gameScreen').style.display = 'flex';
                    document.getElementById('playerName').textContent = playerName;
                    
                    if (data.role) {
                        document.getElementById('roleBadge').innerHTML = 
                            `<span class="role-badge">🤖 ${data.role}</span>`;
                    }
                    
                    // Display rules in fixed box instead of chat bubble
                    const rulesBox = document.getElementById('rulesBox');
                    rulesBox.style.display = 'block';
                    rulesBox.textContent = data.rules;
                    
                    startPolling();
                }
            })
            .catch(err => {
                errorDiv.textContent = 'Connection error. Please try again.';
                console.error(err);
            });
        }
        
        function startPolling() {
            pollInterval = setInterval(pollMessages, 1000);
        }
        
        function pollMessages() {
            fetch('/messages', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({session_id: sessionId})
            })
            .then(r => {
                if (!r.ok) throw new Error('Network response was not ok');
                return r.json();
            })
            .then(data => {
                if (data.error) {
                    console.error('Server error:', data.error);
                    return;
                }
                
                // Store remaining players for elimination check
                window.lastRemainingPlayers = data.remaining_players;
                
                // Add new messages
                if (data.messages && data.messages.length > 0) {
                    console.log(`Received ${data.messages.length} new messages`);
                    data.messages.forEach(msg => addMessage(msg));
                }
                
                // Update phase indicator
                updatePhaseIndicator(data);
                
                // Update input state
                updateInputState(data);
                
                // Handle voting panel
                if (data.can_vote && data.remaining_players) {
                    showVotePanel(data.remaining_players);
                } else {
                    hideVotePanel();
                    hasVoted = false;
                }
                
                // Game over
                if (data.game_over) {
                    clearInterval(pollInterval);
                    document.getElementById('messageInput').disabled = true;
                    document.querySelector('#inputArea button').disabled = true;
                    
                    // Show game over message once
                    if (data.game_over_message && !gameOverMessageShown) {
                        addMessage({
                            text: "🏁 Game Over\\n" + data.game_over_message,
                            type: "manager"
                        });
                        gameOverMessageShown = true;
                    }
                    
                    // Show survey for human players only
                    if (!isAI && !surveyShown) {
                        surveyShown = true;
                        setTimeout(() => showSurvey(), 2000); // Wait 2 seconds after game over
                    }
                }
            })
            .catch(err => {
                console.error('Polling error:', err);
            });
        }
        
        function updatePhaseIndicator(data) {
            const indicator = document.getElementById('phaseIndicator');
            if (data.game_over) {
                indicator.textContent = '🏁 Game Over';
                indicator.style.background = '#d4edda';
                indicator.style.color = '#155724';
            } else if (data.can_vote) {
                indicator.textContent = '🗳️ Voting Phase';
                indicator.style.background = '#ffe6e6';
                indicator.style.color = '#721c24';
            } else if (data.can_chat) {
                indicator.textContent = '💬 Discussion Phase';
                indicator.style.background = '#d1ecf1';
                indicator.style.color = '#0c5460';
            } else if (data.game_started) {
                indicator.textContent = '⏸️ Between Phases...';
                indicator.style.background = '#fff3cd';
                indicator.style.color = '#856404';
            } else {
                indicator.textContent = '⏳ Waiting for all players...';
                indicator.style.background = '#f8f9fa';
                indicator.style.color = '#6c757d';
            }
        }
        
        function updateInputState(data) {
            // 🛑 If the player has been eliminated → fully disable input
            if (data.remaining_players && !data.remaining_players.includes(playerName)) {
                const input = document.getElementById('messageInput');
                const button = document.querySelector('#inputArea button');
                const inputArea = document.getElementById('inputArea');
                
                inputArea.classList.remove('hidden');
                input.disabled = true;
                button.disabled = true;
                input.placeholder = 'You have been eliminated and cannot send messages.';
                return; // Stop function from re-enabling
            }
            
            const input = document.getElementById('messageInput');
            const button = document.querySelector('#inputArea button');
            const inputArea = document.getElementById('inputArea');
            
            if (data.can_chat) {
                inputArea.classList.remove('hidden');
                input.disabled = false;
                button.disabled = false;
                input.placeholder = 'Type your message...';
            } else if (data.can_vote) {
                inputArea.classList.add('hidden');
            } else if (data.game_started) {
                inputArea.classList.remove('hidden');
                input.disabled = true;
                button.disabled = true;
                input.placeholder = 'Please wait...';
            } else {
                inputArea.classList.remove('hidden');
                input.disabled = true;
                button.disabled = true;
                input.placeholder = 'Waiting for game to start...';
            }
        }
        
        function addMessage(msg) {
            const container = document.getElementById('messagesContainer');
            const div = document.createElement('div');
            
            div.className = `message ${msg.type}`;
            
            // Format message content
            let formattedText = msg.text.replace(/\\n/g, "<br>");
            
            // Apply color formatting for chat messages
            if (msg.type === 'chat') {
                formattedText = formatChatMessage(formattedText);
            }
            
            div.innerHTML = formattedText;
            
            container.appendChild(div);
            
            // Force scroll to bottom
            container.scrollTop = container.scrollHeight;
            
            messageCount++;
            console.log(`Message #${messageCount} added: ${msg.text.substring(0, 50)}...`);
        }
        
        function sendMessage() {
            // 🛑 Block sending if player is eliminated
            if (window.lastRemainingPlayers && !window.lastRemainingPlayers.includes(playerName)) {
                console.log('[Send] Blocked – player is eliminated');
                return;
            }
            
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            console.log('[Send] Called, message:', message);
            
            if (!message) {
                console.log('[Send] No message');
                return;
            }
            if (input.disabled) {
                console.log('[Send] Input disabled');
                return;
            }
            
            console.log('[Send] Sending to server...');
            
            fetch('/send', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({session_id: sessionId, message: message})
            })
            .then(r => {
                console.log('[Send] Response status:', r.status);
                return r.json();
            })
            .then(data => {
                console.log('[Send] Response:', data);
                if (data.success) {
                    input.value = '';
                } else {
                    console.error('[Send] Failed:', data);
                }
            })
            .catch(err => {
                console.error('[Send] Error:', err);
            });
        }
        
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
        
        function showVotePanel(players) {
            const panel = document.getElementById('votePanel');
            const buttonsDiv = document.getElementById('voteButtons');
            
            if (panel.style.display === 'block') return;
            
            panel.style.display = 'block';
            buttonsDiv.innerHTML = '';
            
            players.forEach(p => {
                if (p !== playerName) {
                    const btn = document.createElement('span');
                    btn.className = 'vote-button';
                    btn.textContent = p;
                    btn.onclick = () => vote(p);
                    buttonsDiv.appendChild(btn);
                }
            });
        }
        
        function hideVotePanel() {
            document.getElementById('votePanel').style.display = 'none';
        }
        
        function vote(votedName) {
            if (hasVoted) {
                console.log('[Vote] Already voted this round');
                return;
            }
            
            console.log('[Vote] Voting for:', votedName);
            
            // Disable all vote buttons immediately
            document.querySelectorAll('.vote-button').forEach(btn => {
                btn.classList.add('disabled');
                btn.style.pointerEvents = 'none';
                btn.style.opacity = '0.6';
            });
            
            hasVoted = true;
            
            fetch('/vote', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({session_id: sessionId, voted_name: votedName})
            })
            .then(r => r.json())
            .then(data => {
                console.log('[Vote] Response:', data);
                if (data.success) {
                    hideVotePanel();
                    addMessage({text: `✅ You voted to eliminate ${votedName}`, type: 'manager'});
                } else if (data.error) {
                    addMessage({text: `⚠️ ${data.error}`, type: 'manager'});
                }
            })
            .catch(err => {
                console.error('[Vote] Error:', err);
                hasVoted = false;
                document.querySelectorAll('.vote-button').forEach(btn => {
                    btn.classList.remove('disabled');
                    btn.style.pointerEvents = '';
                    btn.style.opacity = '';
                });
            });
        }
        
        function showSurvey() {
            console.log('[Survey] Showing survey modal');
            
            // Load player options for survey
            fetch('/get_survey_options', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({session_id: sessionId})
            })
            .then(r => r.json())
            .then(data => {
                if (data.error) {
                    console.error('[Survey] Error loading options:', data.error);
                    return;
                }
                
                const select = document.getElementById('aiGuess');
                select.innerHTML = '<option value="">Select a player...</option>';
                data.players.forEach(name => {
                    const option = document.createElement('option');
                    option.value = name;
                    option.textContent = name;
                    select.appendChild(option);
                });
                
                // Show modal
                document.getElementById('surveyModal').classList.add('show');
            })
            .catch(err => {
                console.error('[Survey] Error:', err);
            });
        }
        
        function selectConfidence(level) {
            selectedConfidence = level;
            document.querySelectorAll('.confidence-option').forEach((el, idx) => {
                if (idx + 1 === level) {
                    el.classList.add('selected');
                } else {
                    el.classList.remove('selected');
                }
            });
        }
        
        function submitSurvey() {
            const guessedAI = document.getElementById('aiGuess').value;
            
            if (!guessedAI) {
                alert('Please select who you think was the AI');
                return;
            }
            
            if (!selectedConfidence) {
                alert('Please select your confidence level');
                return;
            }
            
            console.log('[Survey] Submitting:', {guessedAI, selectedConfidence});
            
            document.getElementById('surveySubmitBtn').disabled = true;
            
            fetch('/survey_submit', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    session_id: sessionId,
                    guessed_ai: guessedAI,
                    confidence: selectedConfidence
                })
            })
            .then(r => r.json())
            .then(data => {
                console.log('[Survey] Response:', data);
                if (data.success) {
                    // Show thank you message
                    document.getElementById('surveyForm').style.display = 'none';
                    document.getElementById('surveyThankYou').style.display = 'block';
                    
                    // Close modal after 3 seconds
                    setTimeout(() => {
                        document.getElementById('surveyModal').classList.remove('show');
                    }, 3000);
                } else {
                    alert('Error submitting survey: ' + (data.error || 'Unknown error'));
                    document.getElementById('surveySubmitBtn').disabled = false;
                }
            })
            .catch(err => {
                console.error('[Survey] Error:', err);
                alert('Error submitting survey');
                document.getElementById('surveySubmitBtn').disabled = false;
            });
        }
    </script>
</body>
</html>
